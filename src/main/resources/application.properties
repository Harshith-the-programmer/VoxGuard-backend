spring.application.name=voice-clone-backend
server.port=8081

# Database credentials are supplied through Windows environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voice_clone_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Keep schema update for the existing local development workflow for now.
# We will move to controlled database migrations in a later hardening step.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT settings. JWT_SECRET must be a Base64-encoded random key of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Preserve the existing upload directory for local development.
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Do not expose internal error details through default Spring error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8000}